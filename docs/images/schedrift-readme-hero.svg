<path d="M15 0H519Q534 0 534 15V58H0V15Q0 0 15 0Z" fill="#EEF1EF"/>
<circle cx="22" cy="28" r="5" fill="#CED4D0"/><circle cx="40" cy="28" r="5" fill="#CED4D0"/><circle cx="58" cy="28" r="5" fill="#CED4D0"/>
<text x="86" y="34" font-size="13" font-weight="700" fill="#1F2226" font-family="Arial,Helvetica,sans-serif">EXECUTIVE TIMELINE</text>
