<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Schedrift — complex schedules, clear decisions</title>
<desc id="desc">An editorial product banner showing a clean Gantt chart with gently revealing task bars, a moving Go-Live guide and a subtle milestone highlight. Animation stops for reduced-motion preferences.</desc>
<style>
/* Static artwork is the default fallback; animations are progressive enhancement. */
@keyframes bar-reveal { 0% { transform: scaleX(.08); opacity: .3; } 18%, 100% { transform: scaleX(1); opacity: 1; } }
@keyframes progress-reveal { 0%, 8% { transform: scaleX(.02); } 30%, 100% { transform: scaleX(1); } }
@keyframes milestone-breathe { 0%, 70%, 100% { opacity: 0; transform: scale(0.6); } 79% { opacity: .33; } 94% { opacity: 0; transform: scale(2.1); } }
@keyframes timeline-travel { to { stroke-dashoffset: -40; } }
@keyframes label-glow { 0%, 70%, 100% { opacity: 1; } 82% { opacity: .73; } }
.task-bar { transform-box: fill-box; transform-origin: left center; animation: bar-reveal 7s cubic-bezier(.2,.75,.2,1) infinite; }
.task-two { animation-delay: .25s; }
.task-three { animation-delay: .5s; }
.progress-bar { transform-box: fill-box; transform-origin: left center; animation: progress-reveal 7s cubic-bezier(.2,.75,.2,1) infinite; }
.progress-two { animation-delay: .32s; }
.progress-three { animation-delay: .58s; }
.milestone-halo { transform-box: fill-box; transform-origin: center center; animation: milestone-breathe 7s ease-out infinite; }
.go-live-line { animation: timeline-travel 8s linear infinite; }
.go-live-label { animation: label-glow 7s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
 .task-bar, .progress-bar, .milestone-halo, .go-live-line, .go-live-label { animation: none !important; }
}
</style>
<rect width="1200" height="480" rx="24" fill="#F5F5F2"/>
<path d="M0 410H1200" stroke="#E5E7E3"/>
<g transform="translate(68 59)">
 <rect x="0" y="0" width="48" height="16" rx="4" fill="#1F2226"/>
 <rect x="0" y="20" width="48" height="6" rx="2" fill="#1F2226"/>
 <rect x="16" y="37" width="48" height="16" rx="4" fill="#3E8A7E"/>
 <rect x="0" y="57" width="48" height="6" rx="2" fill="#1F2226"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2226">
 <text x="152" y="106" font-weight="700" font-size="43" letter-spacing="-1.7">Schedrift</text>
 <text x="68" y="193" font-weight="700" font-size="47" letter-spacing="-2.2">Complex schedules.</text>
 <text x="68" y="246" font-weight="700" font-size="47" letter-spacing="-2.2" fill="#3E8A7E">Clear decisions.</text>
 <text x="70" y="297" font-size="20" fill="#5B6263">Turn Microsoft Project schedules into</text>
 <text x="70" y="326" font-size="20" fill="#5B6263">presentation-ready project timelines.</text>
 <rect x="68" y="359" width="132" height="36" rx="18" fill="#1F2226"/>
 <text x="134" y="383" font-weight="700" fill="#FFFFFF" font-size="12" text-anchor="middle" letter-spacing=".9">LOCAL-FIRST</text>
