<text x="37" y="103" font-size="13" font-weight="700" fill="#1F2226" font-family="Arial,Helvetica,sans-serif">Project rollout</text>
<text x="456" y="103" font-size="12" font-weight="700" fill="#3E8A7E" font-family="Arial,Helvetica,sans-serif">68%</text>
<line x1="24" y1="137" x2="510" y2="137" stroke="#E7EBE8"/>
<g font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5B6263">
<text x="26" y="169">Discovery</text><text x="26" y="218">Build &amp; test</text><text x="26" y="267">UAT</text><text x="26" y="316">Go-Live</text>
</g>
<g stroke="#EEF1EF"><line x1="192" y1="146" x2="192" y2="325"/><line x1="272" y1="146" x2="272" y2="325"/><line x1="352" y1="146" x2="352" y2="325"/><line x1="432" y1="146" x2="432" y2="325"/></g>
